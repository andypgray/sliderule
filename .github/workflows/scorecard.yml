# OpenSSF Scorecard: automated supply-chain security score for the repository while it is public.
# publish_results: true feeds the REST API + the README badge and requires id-token: write.
# While the repository is private the analysis job skips: Scorecard cannot check it out and code
# scanning is unavailable. The visibility job asks the API rather than reading the event, because a
# scheduled run's payload carries no repository, and the analysis resumes by itself once the
# repository is public again.
name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: '30 2 * * 1'   # Mondays 02:30 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  visibility:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      public: ${{ steps.probe.outputs.public }}
    steps:
      - id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          public="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private == false')"
          echo "public=$public" >> "$GITHUB_OUTPUT"

  analysis:
    name: Scorecard analysis
    needs: visibility
    if: needs.visibility.outputs.public == 'true'
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to code scanning
      id-token: write          # publish results for the badge/API

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
